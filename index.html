<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tıbbi Görüntüleme Terminolojisi Sözlüğü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 35%, #7c3aed 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex; flex-direction: column; height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .header {
            background: rgba(255,255,255,0.97);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
            border-radius: 0 0 18px 18px;
            padding: 12px 14px 8px;
        }
        .header h1 {
            text-align: center; font-size: clamp(18px, 2vw, 24px);
            color: #1d4ed8; margin-bottom: 10px;
        }
        .search-box {
            display: flex; gap: 8px; margin-bottom: 8px;
        }
        .search-box input {
            flex: 1; border: 2px solid #2563eb; border-radius: 10px;
            padding: 10px 12px; font-size: 14px; background: white; color: #0f172a;
        }
        .search-box button {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white; border: none; border-radius: 10px; padding: 10px 14px;
            font-weight: 700; cursor: pointer;
        }
        .filter-section {
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
            padding-bottom: 4px;
        }
        .filter-btn {
            border: 1.5px solid #2563eb; background: white; color: #1d4ed8;
            border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700;
            cursor: pointer; flex-shrink: 0;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed); color: white;
        }
        .content {
            display: flex; flex: 1; gap: 12px; min-height: 0; padding: 12px;
            overflow: hidden;
        }
        .main-area {
            flex: 1; min-width: 0; background: rgba(255,255,255,0.96);
            border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(15,23,42,0.15);
            display: flex; flex-direction: column;
        }
        .term-counter {
            padding: 8px 12px; background: #eef2ff; border-bottom: 1px solid #dfe7ff;
            color: #1d4ed8; font-size: 12px; font-weight: 700; text-align: center;
        }
        .terms-list {
            flex: 1; overflow-y: auto; padding: 12px;
        }
        .term-card {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            border-left: 4px solid #2563eb; border-radius: 8px; padding: 12px 12px 10px;
            margin-bottom: 10px; box-shadow: 0 3px 10px rgba(37,99,235,0.08); cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .term-card:active { transform: translateX(2px); }
        .term-card.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: white;
            border-left: 4px solid #c4b5fd;
        }
        .term-title {
            font-size: 15px; font-weight: 800; margin-bottom: 4px;
        }
        .term-card.selected .term-title, .term-card.selected .term-pronunciation,
        .term-card.selected .term-turkish { color: #fff; }
        .term-pronunciation {
            font-size: 11px; color: #64748b; font-style: italic; margin-bottom: 4px;
        }
        .term-turkish {
            font-size: 12px; color: #334155; font-weight: 600;
        }
        .term-category {
            display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 999px;
            background: rgba(37,99,235,0.12); color: #1d4ed8; font-weight: 700; font-size: 10px;
        }
        .term-card.selected .term-category {
            background: rgba(255,255,255,0.18); color: white;
        }
        .detail-panel {
            width: 340px; background: rgba(255,255,255,0.97); border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.15); overflow: hidden; display: flex; flex-direction: column;
        }
        .detail-header {
            background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 100%); color: white;
            padding: 14px 14px 12px; border-bottom: 2px solid rgba(255,255,255,0.2);
        }
        .detail-title-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .detail-title {
            font-size: 22px; font-weight: 800;
        }
        .sound-btn {
            border: none; background: rgba(255,255,255,0.2); color: white; border-radius: 10px;
            width: 34px; height: 34px; font-size: 18px; cursor: pointer;
        }
        .sound-btn.speaking { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:0.8;} 50%{opacity:1;} }
        .detail-pronunciation {
            margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.9); font-style: italic;
        }
        .detail-category {
            display: inline-block; margin-top: 8px; background: rgba(255,255,255,0.18);
            padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 700;
        }
        .detail-content {
            padding: 14px; overflow-y: auto; flex: 1;
        }
        .detail-section {
            margin-bottom: 14px;
        }
        .detail-section-title {
            font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
            color: #2563eb; margin-bottom: 7px;
        }
        .detail-box {
            background: #f8fafc; border-left: 4px solid #2563eb; border-radius: 8px;
            padding: 10px; line-height: 1.5; font-size: 14px; color: #1e293b;
        }
        .notes-box {
            background: #fff8e8; border: 1px dashed #f59e0b; border-radius: 8px; padding: 10px;
        }
        .notes-box textarea {
            width: 100%; height: 90px; background: white; border: 1px solid #f5d48f; border-radius: 8px;
            resize: none; padding: 8px; font-family: 'Courier New', monospace; font-size: 12px; color: #1f2937;
        }
        .empty-state {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; color: #94a3b8; text-align: center; padding: 20px;
        }
        .empty-state .icon { font-size: 42px; margin-bottom: 10px; }
        @media (max-width: 900px) {
            .detail-panel { width: 300px; }
        }
        @media (max-width: 760px) {
            .content { display: block; }
            .main-area { height: 52vh; }
            .detail-panel { width: 100%; height: 38vh; margin-top: 12px; }
        }
        .terms-list::-webkit-scrollbar, .detail-content::-webkit-scrollbar { width: 8px; }
        .terms-list::-webkit-scrollbar-thumb, .detail-content::-webkit-scrollbar-thumb {
            background: #8b5cf6; border-radius: 999px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Tıbbi Görüntüleme Terminolojisi</h1>
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="Terim ara (İngilizce / Türkçe / okunuş)..." autocomplete="off">
                <button id="clearBtn" type="button">Temizle</button>
            </div>
            <div class="filter-section" id="filterContainer"></div>
        </div>

        <div class="content">
            <div class="main-area">
                <div class="term-counter" id="termCounter">Yükleniyor...</div>
                <div class="terms-list" id="termsList"></div>
            </div>

            <div class="detail-panel">
                <div class="detail-header">
                    <div class="detail-title-row">
                        <div id="detailTitle" class="detail-title">Terim Seçin</div>
                        <button id="soundBtn" class="sound-btn" type="button" style="display:none;">🔊</button>
                    </div>
                    <div id="detailPronunciation" class="detail-pronunciation"></div>
                    <div id="detailCategory" class="detail-category"></div>
                </div>
                <div id="detailContent" class="detail-content">
                    <div class="empty-state">
                        <div class="icon">👈</div>
                        <div>Bir terim seçerek detay görünümünü açabilirsiniz.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const terms = [
            { english: "Anatomical position", turkish: "Anatomik pozisyon", pronunciation: "an-uh-TOM-ih-kul puh-ZISH-un", category: "Temel Anatomi", definition: "Vücut dik dururken, baş öne bakacak şekilde, kollar yanlarda, avuç içleri öne doğru olacak şekilde duran standart anatomi pozisyonu.", modality: "Anatomi" },
            { english: "Superior", turkish: "Superior / Üst", pronunciation: "soo-PEER-ee-or", category: "Temel Anatomi", definition: "Baş tarafına daha yakın olan yön.", modality: "Anatomi" },
            { english: "Inferior", turkish: "Inferior / Alt", pronunciation: "in-FEER-ee-or", category: "Temel Anatomi", definition: "Ayak tarafına daha yakın olan yön.", modality: "Anatomi" },
            { english: "Anterior", turkish: "Anterior / Ön", pronunciation: "an-TEER-ee-or", category: "Temel Anatomi", definition: "Gövdenin ön tarafı.", modality: "Anatomi" },
            { english: "Posterior", turkish: "Posterior / Arka", pronunciation: "pos-TEER-ee-or", category: "Temel Anatomi", definition: "Gövdenin arka tarafı.", modality: "Anatomi" },
            { english: "Medial", turkish: "Medial / Orta hat", pronunciation: "MEE-dee-ul", category: "Temel Anatomi", definition: "Vücudun orta hattına yakın olan yön.", modality: "Anatomi" },
            { english: "Lateral", turkish: "Lateral / Yan", pronunciation: "LAT-er-ul", category: "Temel Anatomi", definition: "Orta hattın yan tarafı.", modality: "Anatomi" },
            { english: "Proximal", turkish: "Proksimal / Yakın", pronunciation: "PROK-sih-mul", category: "Temel Anatomi", definition: "Gövdeye daha yakın olan nokta.", modality: "Anatomi" },
            { english: "Distal", turkish: "Distal / Uzak", pronunciation: "DIS-tul", category: "Temel Anatomi", definition: "Gövdeye daha uzak olan nokta.", modality: "Anatomi" },
            { english: "Sagittal plane", turkish: "Sagittal düzlem", pronunciation: "SAJ-it-ul PLAYN", category: "Temel Anatomi", definition: "Vücudu sağ ve sol yarıya bölen düzlem.", modality: "Anatomi" },
            { english: "Coronal plane", turkish: "Koronal düzlem", pronunciation: "ko-ROH-nul PLAYN", category: "Temel Anatomi", definition: "Vücudu ön ve arka bölümlere ayıran düzlem.", modality: "Anatomi" },
            { english: "Axial plane", turkish: "Aksiyal düzlem", pronunciation: "AK-see-ul PLAYN", category: "Temel Anatomi", definition: "Vücudu üst-alt bölümüne bölen yatay düzlem.", modality: "Anatomi" },
            { english: "Skull", turkish: "Kafatası", pronunciation: "skul", category: "Temel Anatomi", definition: "Beyni ve yüz kemiklerini koruyan iskelet yapısı.", modality: "Anatomi" },
            { english: "Cranium", turkish: "Kranium", pronunciation: "KRAY-nee-um", category: "Temel Anatomi", definition: "Kafatasının beyin kısmı.", modality: "Anatomi" },
            { english: "Mandible", turkish: "Alt çene", pronunciation: "MAN-di-bul", category: "Temel Anatomi", definition: "Alt çenenin kemik yapısı.", modality: "Anatomi" },
            { english: "Clavicle", turkish: "Köprücük kemiği", pronunciation: "KLAV-i-kul", category: "Temel Anatomi", definition: "Omuzu göğüs kafesine bağlayan kemik.", modality: "Anatomi" },
            { english: "Scapula", turkish: "Omuz kürek kemiği", pronunciation: "SKAP-yuh-luh", category: "Temel Anatomi", definition: "Arka omuzda bulunan geniş üçgen kemik.", modality: "Anatomi" },
            { english: "Sternum", turkish: "Göğüs kemiği", pronunciation: "STER-num", category: "Temel Anatomi", definition: "Göğüs boşluğunun ön orta hattında yer alan kemik.", modality: "Anatomi" },
            { english: "Rib", turkish: "Kaburga", pronunciation: "rib", category: "Temel Anatomi", definition: "Göğüs boşluğunu çevreleyen kemik yapı.", modality: "Anatomi" },
            { english: "Vertebra", turkish: "Omur", pronunciation: "VER-tuh-bruh", category: "Temel Anatomi", definition: "Omurga sütununu oluşturan kemik.", modality: "Anatomi" },

            { english: "Femur", turkish: "Uyluk kemiği", pronunciation: "FEE-mur", category: "Temel Anatomi", definition: "Vücudun en uzun ve güçlü kemiği.", modality: "Anatomi" },
            { english: "Patella", turkish: "Diz kapağı", pronunciation: "puh-TEL-uh", category: "Temel Anatomi", definition: "Dizin ön yüzünde yer alan küçük kemik.", modality: "Anatomi" },
            { english: "Tibia", turkish: "Kaval kemiği", pronunciation: "TIB-ee-uh", category: "Temel Anatomi", definition: "Bacağın iç tarafındaki ana kemik.", modality: "Anatomi" },
            { english: "Fibula", turkish: "Fibula / Dış bacak kemiği", pronunciation: "FIB-yuh-luh", category: "Temel Anatomi", definition: "Bacağın dış tarafında yer alan ince kemik.", modality: "Anatomi" },

            { english: "Muscle", turkish: "Kas", pronunciation: "MUS-ul", category: "Temel Anatomi", definition: "İskelete veya iç organlara hareket kazandıran doku.", modality: "Anatomi" },
            { english: "Cardiac muscle", turkish: "Kalp kası", pronunciation: "KAR-dee-ak MUS-ul", category: "Temel Anatomi", definition: "Kalbin duvarını oluşturan kas türü.", modality: "Anatomi" },
            { english: "Skeletal muscle", turkish: "İskelet kası", pronunciation: "SKEL-uh-tul MUS-ul", category: "Temel Anatomi", definition: "İskelete bağlı olarak hareketi sağlayan kas.", modality: "Anatomi" },
            { english: "Smooth muscle", turkish: "Düz kas", pronunciation: "smooTH MUS-ul", category: "Temel Anatomi", definition: "İç organların duvarında bulunan kas türü.", modality: "Anatomi" },
            { english: "Heart", turkish: "Kalp", pronunciation: "hart", category: "Temel Anatomi", definition: "Kanı vücuda pompalayan organ.", modality: "Anatomi" },
            { english: "Lung", turkish: "Akciğer", pronunciation: "lung", category: "Temel Anatomi", definition: "Gaz değişiminin yapıldığı solunum organı.", modality: "Anatomi" },
            { english: "Bronchi", turkish: "Bronşlar", pronunciation: "BRONK-eye", category: "Temel Anatomi", definition: "Trakeadan ayrılan hava yolunun dalları.", modality: "Anatomi" },
            { english: "Trachea", turkish: "Trakea / Hava borusu", pronunciation: "TRAY-kee-uh", category: "Temel Anatomi", definition: "Ağızdan ya da burundan akciğerlere hava taşıyan boru.", modality: "Anatomi" },

            { english: "Protocol", turkish: "Protokol", pronunciation: "PROH-tuh-kol", category: "Tıbbi Terminoloji", definition: "Bir görüntüleme için belirlenen standart uygulama düzeni.", modality: "Radyoloji" },
            { english: "Positioning", turkish: "Pozisyonlama", pronunciation: "puh-ZISH-un-ing", category: "Tıbbi Terminoloji", definition: "Hasta ya da vücut bölgesinin uygun açı ve konumda tutulması.", modality: "Radyografi" },
            { english: "Projection", turkish: "Projeksiyon", pronunciation: "proh-JEK-shun", category: "Tıbbi Terminoloji", definition: "Işın yoluna göre görüntü elde etme yönü.", modality: "Radyografi" },
            { english: "AP view", turkish: "AP görünümü", pronunciation: "A-P vyoo", category: "Radyoloji Teknikleri", definition: "Anterior-posterior yönünde alınan radyografi görünümü.", modality: "Radyografi" },
            { english: "Lateral view", turkish: "Lateral görünüm", pronunciation: "LAT-er-ul vyoo", category: "Radyoloji Teknikleri", definition: "Yandan alınan görüntüleme görünümü.", modality: "Radyografi" },
            { english: "Oblique view", turkish: "Oblik görünüm", pronunciation: "oh-BLEEK vyoo", category: "Radyoloji Teknikleri", definition: "Normal eksenlere göre eğik alınan görüntü.", modality: "Radyografi" },
            { english: "Collimation", turkish: "Kolimasyon", pronunciation: "kol-ih-MAY-shun", category: "Radyoloji Teknikleri", definition: "Radyasyon alanını daraltarak görüntüleme alanını sınırlama işlemi.", modality: "Radyografi" },
            { english: "Grid", turkish: "Grid / Izgara", pronunciation: "grid", category: "Radyoloji Teknikleri", definition: "Saçılan radyasyonun azaltılmasında kullanılan ızgara yapısı.", modality: "Radyografi" },
            { english: "Exposure", turkish: "Maruziyet / ekspoziyon", pronunciation: "ik-SPOH-zhur", category: "Radyoloji Teknikleri", definition: "Cihazın radyasyona maruz bırakma düzeyi.", modality: "Radyografi" },
            { english: "kVp", turkish: "kVp", pronunciation: "kay-vee-pee", category: "Radyoloji Teknikleri", definition: "Röntgen tüpündeki voltajın belirlenmesini sağlayan değer.", modality: "Radyografi" },
            { english: "mAs", turkish: "mAs", pronunciation: "em-ay-ess", category: "Radyoloji Teknikleri", definition: "X-ışını akım süresi ve doz ilişkisini gösteren parametre.", modality: "Radyografi" },
            { english: "SID", turkish: "SID", pronunciation: "ess-eye-dee", category: "Radyoloji Teknikleri", definition: "Kaynak-görüntüleme mesafesi.", modality: "Radyografi" },
            { english: "OID", turkish: "OID", pronunciation: "oh-eye-dee", category: "Radyoloji Teknikleri", definition: "Obje-görüntüleme mesafesi.", modality: "Radyografi" },
            { english: "Windowing", turkish: "Pencereleme", pronunciation: "WIN-doh-ing", category: "Radyoloji Teknikleri", definition: "BT ve MR görüntülerinde gri ton aralığının ayarlanması.", modality: "BT / MR" },
            { english: "Reconstruction", turkish: "Rekonstrüksiyon", pronunciation: "ree-kon-STRUK-shun", category: "Radyoloji Teknikleri", definition: "Kesitsel veriden 3D veya farklı görüntü formuna dönüştürme işlemi.", modality: "BT / MR" },
            { english: "Gantry", turkish: "Gantry / Cihaz kolu", pronunciation: "GAN-tree", category: "Radyoloji Teknikleri", definition: "BT cihazında halka şeklindeki aparat yapısı.", modality: "BT" },
            { english: "Pitch", turkish: "Pitch / Kılavuz oranı", pronunciation: "pitch", category: "Radyoloji Teknikleri", definition: "BT tarama sırasında masanın ilerleme mesafesi ile kesit genişliği oranı.", modality: "BT" },
            { english: "Matrix", turkish: "Matris", pronunciation: "MAY-triks", category: "Radyoloji Teknikleri", definition: "Görüntünün düzenlendiği piksel veya hücre dizisi.", modality: "BT / MR / Radyografi" }
        ];

        const allTerms = [...terms];
        let filteredTerms = [...allTerms];
        let selectedCategory = 'Tümü';
        let selectedTerm = null;

        function initializeFilters() {
            const categories = ['Tümü', ...new Set(allTerms.map(term => term.category))];
            const filterContainer = document.getElementById('filterContainer');
            filterContainer.innerHTML = '';
            categories.forEach((cat) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'filter-btn' + (cat === 'Tümü' ? ' active' : '');
                button.textContent = cat;
                button.onclick = () => filterByCategory(cat);
                filterContainer.appendChild(button);
            });
        }

        function filterByCategory(category) {
            selectedCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === category);
            });
            applySearch();
        }

        function applySearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const source = selectedCategory === 'Tümü' ? allTerms : allTerms.filter(term => term.category === selectedCategory);

            filteredTerms = source.filter(term => {
                const haystack = [
                    term.english,
                    term.turkish,
                    term.pronunciation,
                    term.definition,
                    term.modality,
                    term.category
                ].join(' ').toLowerCase();
                return haystack.includes(q);
            });
            renderTermsList();
            updateCounter();
            if (!filteredTerms.length) {
                selectedTerm = null;
                renderDetailEmpty();
            } else if (!selectedTerm || !filteredTerms.find(t => t.english === selectedTerm.english)) {
                selectedTerm = filteredTerms[0];
                renderDetailPanel();
            }
        }

        function renderTermsList() {
            const list = document.getElementById('termsList');
            if (!filteredTerms.length) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔎</div>
                        <div>Aramanızla eşleşen terim bulunamadı.</div>
                    </div>
                `;
                return;
            }
            list.innerHTML = filteredTerms.map(term => `
                <div class="term-card ${selectedTerm && selectedTerm.english === term.english ? 'selected' : ''}" data-term="${term.english}" onclick="selectTerm('${term.english.replace(/'/g, "\\'")}')">
                    <div class="term-title">${term.english}</div>
                    <div class="term-pronunciation">${term.pronunciation}</div>
                    <div class="term-turkish">${term.turkish}</div>
                    <div class="term-category">${term.category}</div>
                </div>
            `).join('');
        }

        function selectTerm(termEnglish) {
            const term = allTerms.find(t => t.english === termEnglish);
            if (!term) return;
            selectedTerm = term;
            renderTermsList();
            renderDetailPanel();
        }

        function renderDetailEmpty() {
            document.getElementById('detailTitle').textContent = 'Terim Seçin';
            document.getElementById('detailPronunciation').textContent = '';
            document.getElementById('detailCategory').textContent = '';
            document.getElementById('soundBtn').style.display = 'none';
            document.getElementById('detailContent').innerHTML = `
                <div class="empty-state">
                    <div class="icon">📖</div>
                    <div>Sonuç bulunamadı. Farklı kelime arayabilirsiniz.</div>
                </div>
            `;
        }

        function renderDetailPanel() {
            if (!selectedTerm) {
                renderDetailEmpty();
                return;
            }
            const title = document.getElementById('detailTitle');
            const pronunciation = document.getElementById('detailPronunciation');
            const category = document.getElementById('detailCategory');
            const soundBtn = document.getElementById('soundBtn');
            const content = document.getElementById('detailContent');

            title.textContent = selectedTerm.english;
            pronunciation.textContent = selectedTerm.pronunciation;
            category.textContent = selectedTerm.category;
            soundBtn.style.display = 'inline-flex';
            soundBtn.classList.remove('speaking');

            content.innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Türkçe karşılığı</div>
                    <div class="detail-box">${selectedTerm.turkish}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Okunuş</div>
                    <div class="detail-box">${selectedTerm.pronunciation}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Tanım</div>
                    <div class="detail-box">${selectedTerm.definition}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Modalite / Alan</div>
                    <div class="detail-box">${selectedTerm.modality}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title">Ders Notları</div>
                    <div class="notes-box">
                        <textarea id="noteArea" placeholder="Bu terim için kısa not yazın...">${selectedTerm.notes || ''}</textarea>
                    </div>
                </div>
            `;

            const noteArea = document.getElementById('noteArea');
            noteArea.addEventListener('input', (event) => {
                selectedTerm.notes = event.target.value;
            });
        }

        function speakText(text, lang) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8;
            utterance.pitch = 1;
            utterance.volume = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            applySearch();
        });

        document.getElementById('searchInput').addEventListener('input', applySearch);

        document.getElementById('soundBtn').addEventListener('click', () => {
            const soundBtn = document.getElementById('soundBtn');
            soundBtn.classList.add('speaking');
            if (!selectedTerm) return;
            speakText(selectedTerm.english, 'en-US');
            setTimeout(() => soundBtn.classList.remove('speaking'), 1200);
        });

        initializeFilters();
        selectedTerm = allTerms[0];
        renderTermsList();
        renderDetailPanel();
        updateCounter();

        function updateCounter() {
            document.getElementById('termCounter').textContent = `${filteredTerms.length} / ${allTerms.length} terim`;
        }
    </script>
</body>
</html>
